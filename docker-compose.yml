version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: banking
      POSTGRES_USER: banking
      POSTGRES_DB: banking
    ports: ["5432:5432"]
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
  user-service:
    build: ./services/user-service
    ports: ["8001:8000"]
  account-service:
    build: ./services/account-service
    ports: ["8002:8000"]
